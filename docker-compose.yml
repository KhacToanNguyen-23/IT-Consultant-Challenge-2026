services:
  # 1. DATABASE: PostgreSQL
  db:
    image: pgvector/pgvector:pg15
    container_name: sitedesk_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-sitedesk_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sitedesk_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sitedesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. BACKEND: Python FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitedesk_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password123}@db:5432/${POSTGRES_DB:-sitedesk_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - sitedesk_net

  # 3. FRONTEND: Next.js (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sitedesk_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - sitedesk_net

volumes:
  pgdata:

networks:
  sitedesk_net:
    driver: bridge
