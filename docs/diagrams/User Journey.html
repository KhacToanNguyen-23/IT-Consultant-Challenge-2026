<!doctype html><html lang='en'><head><meta charset='utf-8'><title>SiteDesk User Journey</title><style>@page{size:297mm 210mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff}.page{width:297mm;height:210mm;overflow:hidden;page-break-after:always}.page:last-child{page-break-after:auto}.page svg{display:block;width:100%;height:100%}</style></head><body><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">User journey 1: at the counter, from list to confirmed order</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">The associate serves the customer in person. SRS v2: UC1 to UC4, FR-001 to FR-020.</tspan></text><rect x="20" y="98" width="1085" height="142" fill="#f8fafd" stroke="#d3deec"/><rect x="20" y="98" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,169.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Customer</text><rect x="20" y="240" width="1085" height="142" fill="#f1f5fb" stroke="#d3deec"/><rect x="20" y="240" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,311.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Counter associate</text><rect x="20" y="382" width="1085" height="142" fill="#f8fafd" stroke="#d3deec"/><rect x="20" y="382" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,453.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">SiteDesk</text><rect x="60" y="107.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="72" cy="119.0" r="10" fill="#0b3a6b"/><text x="72" y="123.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">1</tspan></text><text x="68" y="143.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="68" dy="0">Hands over the</tspan><tspan x="68" dy="13">list (PDF,</tspan><tspan x="68" dy="13">pasted or</tspan><tspan x="68" dy="13">e-mail text)</tspan></text><text x="68" y="223.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="68" dy="0">UC1</tspan></text><rect x="177" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="189" cy="261.0" r="10" fill="#0b3a6b"/><text x="189" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="189" dy="0">2</tspan></text><text x="185" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="185" dy="0">Uploads or</tspan><tspan x="185" dy="13">pastes it, then</tspan><tspan x="185" dy="13">Read list</tspan></text><text x="185" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="185" dy="0">FR-001 intake</tspan></text><rect x="294" y="391.0" width="104" height="124" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.8"/><circle cx="306" cy="403.0" r="10" fill="#0b3a6b"/><text x="306" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">3</tspan></text><text x="302" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="302" dy="0">Masks e-mail</tspan><tspan x="302" dy="13">and phone;</tspan><tspan x="302" dy="13">reads every</tspan><tspan x="302" dy="13">line, keeps</tspan><tspan x="302" dy="13">unreadable ones</tspan></text><text x="302" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="302" dy="0">FR-002 masking</tspan></text><rect x="411" y="391.0" width="104" height="124" rx="8" fill="#ede7fb" stroke="#9b87d8" stroke-width="1.8"/><circle cx="423" cy="403.0" r="10" fill="#0b3a6b"/><text x="423" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">4</tspan></text><text x="419" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="419" dy="0">Matches SKUs by</tspan><tspan x="419" dy="13">meaning,</tspan><tspan x="419" dy="13">converts units,</tspan><tspan x="419" dy="13">checks live</tspan><tspan x="419" dy="13">stock</tspan></text><text x="419" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="419" dy="0">FR-006-014 match</tspan></text><rect x="528" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="540" cy="261.0" r="10" fill="#0b3a6b"/><text x="540" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="540" dy="0">5</tspan></text><text x="536" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="536" dy="0">Reviews</tspan><tspan x="536" dy="13">exceptions;</tspan><tspan x="536" dy="13">Confirm blocked</tspan><tspan x="536" dy="13">until all</tspan><tspan x="536" dy="13">resolved</tspan></text><text x="536" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="536" dy="0">FR-010 gate</tspan></text><rect x="645" y="391.0" width="104" height="124" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.8"/><circle cx="657" cy="403.0" r="10" fill="#0b3a6b"/><text x="657" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="657" dy="0">6</tspan></text><text x="653" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="653" dy="0">Short or out of</tspan><tspan x="653" dy="13">stock: safe</tspan><tspan x="653" dy="13">alternative</tspan><tspan x="653" dy="13">with price</tspan><tspan x="653" dy="13">difference</tspan></text><text x="653" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="653" dy="0">FR-015 options</tspan></text><rect x="762" y="107.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="774" cy="119.0" r="10" fill="#0b3a6b"/><text x="774" y="123.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="774" dy="0">7</tspan></text><text x="770" y="143.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="770" dy="0">Accepts or</tspan><tspan x="770" dy="13">declines the</tspan><tspan x="770" dy="13">alternative</tspan></text><text x="770" y="223.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="770" dy="0">FR-016 consent</tspan></text><rect x="879" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="891" cy="261.0" r="10" fill="#0b3a6b"/><text x="891" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="891" dy="0">8</tspan></text><text x="887" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="887" dy="0">Chooses client</tspan><tspan x="887" dy="13">or walk-in,</tspan><tspan x="887" dy="13">then Confirm</tspan></text><text x="887" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="887" dy="0">FR-017-018 order</tspan></text><rect x="996" y="391.0" width="104" height="124" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.8"/><circle cx="1008" cy="403.0" r="10" fill="#0b3a6b"/><text x="1008" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1008" dy="0">9</tspan></text><text x="1004" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="1004" dy="0">POS accepts:</tspan><tspan x="1004" dy="13">reference. POS</tspan><tspan x="1004" dy="13">down: CSV, same</tspan><tspan x="1004" dy="13">reference</tspan></text><text x="1004" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="1004" dy="0">FR-019 POS or CSV</tspan></text><path d="M164,169.0 L170.5,169.0 L170.5,311.0 L177,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M281,311.0 L287.5,311.0 L287.5,453.0 L294,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M398,453.0 L411,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M515,453.0 L521.5,453.0 L521.5,311.0 L528,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M632,311.0 L638.5,311.0 L638.5,453.0 L645,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M749,453.0 L755.5,453.0 L755.5,169.0 L762,169.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M866,169.0 L872.5,169.0 L872.5,311.0 L879,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M983,311.0 L989.5,311.0 L989.5,453.0 L996,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="536" width="1085" height="40" fill="#fff8ec" stroke="#f0d3a0"/><rect x="20" y="536" width="30" height="40" fill="#e8a64a"/><text x="35" y="561" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="35" dy="0">R1</tspan></text><rect x="177" y="541" width="338" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="346.0" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="346.0" dy="0">Manual re-keying: every line typed by hand, about 12 min</tspan><tspan x="346.0" dy="11.5">per list (Round 1 estimate)</tspan></text><rect x="528" y="541" width="104" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="580.0" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="580.0" dy="0">Shift-dependent</tspan><tspan x="580.0" dy="11.5">advice</tspan></text><rect x="645" y="541" width="221" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="755.5" y="555" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="755.5" dy="0">Lost sales: "sorry, out of stock"</tspan></text><rect x="879" y="541" width="221" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="989.5" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="989.5" dy="0">Fragmented systems: one connector,</tspan><tspan x="989.5" dy="11.5">CSV fallback</tspan></text><text x="20" y="598" font-size="13" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="20" dy="0">Alternative paths and guardrails</tspan></text><rect x="20.0" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="30.0" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="30.0" dy="0">AI is off</tspan></text><text x="30.0" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="30.0" dy="0">Hard rules and manual catalog search keep</tspan><tspan x="30.0" dy="13.4">the counter running; suggestions are</tspan><tspan x="30.0" dy="13.4">labelled rule-based (FR-003, 033).</tspan></text><rect x="294.25" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="304.25" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="304.25" dy="0">Line is not an order line</tspan></text><text x="304.25" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="304.25" dy="0">The associate removes it (title,</tspan><tspan x="304.25" dy="13.4">greeting). Confirm is refused when the</tspan><tspan x="304.25" dy="13.4">last line would go.</tspan></text><rect x="568.5" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="578.5" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="578.5" dy="0">Customer declines</tspan></text><text x="578.5" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="578.5" dy="0">A reason is recorded and the line stays</tspan><tspan x="578.5" dy="13.4">open; the SKU never changes without</tspan><tspan x="578.5" dy="13.4">agreement (FR-016).</tspan></text><rect x="842.75" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="852.75" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="852.75" dy="0">POS is down</tspan></text><text x="852.75" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="852.75" dy="0">CSV export with the same reference; status</tspan><tspan x="852.75" dy="13.4">NEEDS_MANUAL; the associate keys it into</tspan><tspan x="852.75" dy="13.4">the legacy POS.</tspan></text><rect x="20" y="686" width="1085" height="56" rx="8" fill="#e8f4ec" stroke="#8fc3a0"/><text x="32" y="704" font-size="12" font-weight="800" fill="#1f6b3f" text-anchor="start"><tspan x="32" dy="0">Value shown on the receipt of every order</tspan></text><text x="32" y="721" font-size="11" font-weight="400" fill="#1f3a2a" text-anchor="start"><tspan x="32" dy="0">Sales rescued by substitutes · time from upload to Confirm. Measured per order on simulated data; Round 1 targets are not claimed as results.</tspan></text><rect x="40" y="747" width="13" height="13" rx="3" fill="#ede7fb" stroke="#9b87d8" stroke-width="1.5"/><text x="59" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="59" dy="0">AI-assisted (local embeddings)</tspan></text><rect x="300" y="747" width="13" height="13" rx="3" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.5"/><text x="319" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="319" dy="0">Hard rules (deterministic)</tspan></text><rect x="480" y="747" width="13" height="13" rx="3" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.5"/><text x="499" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="499" dy="0">Human decision or action</tspan></text><rect x="650" y="747" width="13" height="13" rx="3" fill="#fde7c7" stroke="#e8a64a" stroke-width="1.5"/><text x="669" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="669" dy="0">R1 = Round 1 problem</tspan></text><text x="1083" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="end"><tspan x="1083" dy="0">FR = requirement in the team's SRS v2</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">User Journey · page 1/2</tspan></text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">User journey 2: e-mail request to pre-order and pick-up</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">The customer is not at the counter. SRS v2: UC5, FR-022 to FR-028, FR-039 and FR-040.</tspan></text><rect x="20" y="98" width="1085" height="142" fill="#f8fafd" stroke="#d3deec"/><rect x="20" y="98" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,169.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Customer</text><rect x="20" y="240" width="1085" height="142" fill="#f1f5fb" stroke="#d3deec"/><rect x="20" y="240" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,311.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Counter associate</text><rect x="20" y="382" width="1085" height="142" fill="#f8fafd" stroke="#d3deec"/><rect x="20" y="382" width="30" height="142" fill="#0b3a6b"/><text transform="translate(41,453.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">SiteDesk</text><rect x="60" y="107.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="72" cy="119.0" r="10" fill="#0b3a6b"/><text x="72" y="123.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">1</tspan></text><text x="68" y="143.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="68" dy="0">Sends the</tspan><tspan x="68" dy="13">material list</tspan><tspan x="68" dy="13">by e-mail</tspan></text><text x="68" y="223.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="68" dy="0">UC5</tspan></text><rect x="177" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="189" cy="261.0" r="10" fill="#0b3a6b"/><text x="189" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="189" dy="0">2</tspan></text><text x="185" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="185" dy="0">Copies the</tspan><tspan x="185" dy="13">e-mail text</tspan><tspan x="185" dy="13">into SiteDesk</tspan><tspan x="185" dy="13">(E-mail quote)</tspan></text><text x="185" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="185" dy="0">FR-022 e-mail</tspan></text><rect x="294" y="391.0" width="104" height="124" rx="8" fill="#ede7fb" stroke="#9b87d8" stroke-width="1.8"/><circle cx="306" cy="403.0" r="10" fill="#0b3a6b"/><text x="306" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">3</tspan></text><text x="302" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="302" dy="0">Masks, matches,</tspan><tspan x="302" dy="13">checks stock;</tspan><tspan x="302" dy="13">short lines get</tspan><tspan x="302" dy="13">alternatives</tspan></text><text x="302" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="302" dy="0">FR-006-015 match</tspan></text><rect x="411" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="423" cy="261.0" r="10" fill="#0b3a6b"/><text x="423" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">4</tspan></text><text x="419" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="419" dy="0">Copy reply to</tspan><tspan x="419" dy="13">customer; sends</tspan><tspan x="419" dy="13">it from own</tspan><tspan x="419" dy="13">mailbox</tspan></text><text x="419" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="419" dy="0">no e-mail sent</tspan></text><rect x="528" y="107.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="540" cy="119.0" r="10" fill="#0b3a6b"/><text x="540" y="123.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="540" dy="0">5</tspan></text><text x="536" y="143.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="536" dy="0">Agrees by</tspan><tspan x="536" dy="13">e-mail or</tspan><tspan x="536" dy="13">phone, outside</tspan><tspan x="536" dy="13">SiteDesk</tspan></text><text x="536" y="223.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="536" dy="0">FR-039 consent</tspan></text><rect x="645" y="391.0" width="104" height="124" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.8"/><circle cx="657" cy="403.0" r="10" fill="#0b3a6b"/><text x="657" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="657" dy="0">6</tspan></text><text x="653" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="653" dy="0">Save quote:</tspan><tspan x="653" dy="13">price and stock</tspan><tspan x="653" dy="13">snapshot, not</tspan><tspan x="653" dy="13">reserved</tspan></text><text x="653" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="653" dy="0">FR-023-024 quote</tspan></text><rect x="762" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="774" cy="261.0" r="10" fill="#0b3a6b"/><text x="774" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="774" dy="0">7</tspan></text><text x="770" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="770" dy="0">Record sent,</tspan><tspan x="770" dy="13">then Record</tspan><tspan x="770" dy="13">approval</tspan><tspan x="770" dy="13">(channel)</tspan></text><text x="770" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="770" dy="0">FR-022 approval</tspan></text><rect x="879" y="391.0" width="104" height="124" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.8"/><circle cx="891" cy="403.0" r="10" fill="#0b3a6b"/><text x="891" y="407.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="891" dy="0">8</tspan></text><text x="887" y="427.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="887" dy="0">At pick-up: re-</tspan><tspan x="887" dy="13">check live</tspan><tspan x="887" dy="13">stock and</tspan><tspan x="887" dy="13">price, show</tspan><tspan x="887" dy="13">changes</tspan></text><text x="887" y="507.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="887" dy="0">FR-025 re-check</tspan></text><rect x="996" y="249.0" width="104" height="124" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.8"/><circle cx="1008" cy="261.0" r="10" fill="#0b3a6b"/><text x="1008" y="265.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1008" dy="0">9</tspan></text><text x="1004" y="285.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="1004" dy="0">Customer</tspan><tspan x="1004" dy="13">accepts</tspan><tspan x="1004" dy="13">substitutes;</tspan><tspan x="1004" dy="13">Pick slip;</tspan><tspan x="1004" dy="13">Confirm to POS</tspan><tspan x="1004" dy="13">or CSV</tspan></text><text x="1004" y="365.0" font-size="10.5" font-weight="700" fill="#1f4f86" text-anchor="start"><tspan x="1004" dy="0">FR-026-028</tspan></text><path d="M164,169.0 L170.5,169.0 L170.5,311.0 L177,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M281,311.0 L287.5,311.0 L287.5,453.0 L294,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M398,453.0 L404.5,453.0 L404.5,311.0 L411,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M515,311.0 L521.5,311.0 L521.5,169.0 L528,169.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M632,169.0 L638.5,169.0 L638.5,453.0 L645,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M749,453.0 L755.5,453.0 L755.5,311.0 L762,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M866,311.0 L872.5,311.0 L872.5,453.0 L879,453.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M983,453.0 L989.5,453.0 L989.5,311.0 L996,311.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="536" width="1085" height="40" fill="#fff8ec" stroke="#f0d3a0"/><rect x="20" y="536" width="30" height="40" fill="#e8a64a"/><text x="35" y="561" font-size="12" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="35" dy="0">R1</tspan></text><rect x="177" y="541" width="221" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="287.5" y="555" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="287.5" dy="0">Manual re-keying of e-mailed lists</tspan></text><rect x="411" y="541" width="221" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="521.5" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="521.5" dy="0">Customers wait for answers; advice</tspan><tspan x="521.5" dy="11.5">depends on the shift</tspan></text><rect x="645" y="541" width="338" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="814.0" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="814.0" dy="0">Stock changes between order and pick-up cause wrong picks</tspan><tspan x="814.0" dy="11.5">and re-deliveries</tspan></text><rect x="996" y="541" width="104" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="1048.0" y="552" font-size="10.5" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="1048.0" dy="0">Fragmented</tspan><tspan x="1048.0" dy="11.5">systems</tspan></text><text x="20" y="598" font-size="13" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="20" dy="0">Alternative paths and guardrails</tspan></text><rect x="20.0" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="30.0" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="30.0" dy="0">No quote, no Confirm</tspan></text><text x="30.0" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="30.0" dy="0">An e-mail request cannot be confirmed</tspan><tspan x="30.0" dy="13.4">without its quote (QUOTE_REQUIRED).</tspan></text><rect x="294.25" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="304.25" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="304.25" dy="0">No approval, no Prepare</tspan></text><text x="304.25" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="304.25" dy="0">Sending the quote is not approval: Prepare</tspan><tspan x="304.25" dy="13.4">is refused until the customer's approval</tspan><tspan x="304.25" dy="13.4">is recorded.</tspan></text><rect x="568.5" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="578.5" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="578.5" dy="0">Stock changed since the quote</tspan></text><text x="578.5" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="578.5" dy="0">The re-check marks short lines; the</tspan><tspan x="578.5" dy="13.4">substitute is accepted only now, when the</tspan><tspan x="578.5" dy="13.4">customer is there.</tspan></text><rect x="842.75" y="606" width="262.25" height="70" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="852.75" y="624" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="852.75" dy="0">Quote expires or is cancelled</tspan></text><text x="852.75" y="641" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="852.75" dy="0">Expiry is evaluated when the quote is</tspan><tspan x="852.75" dy="13.4">opened; an expired or cancelled quote</tspan><tspan x="852.75" dy="13.4">cannot be confirmed.</tspan></text><rect x="20" y="686" width="1085" height="56" rx="8" fill="#e8f4ec" stroke="#8fc3a0"/><text x="32" y="704" font-size="12" font-weight="800" fill="#1f6b3f" text-anchor="start"><tspan x="32" dy="0">Why this journey matters</tspan></text><text x="32" y="721" font-size="11" font-weight="400" fill="#1f3a2a" text-anchor="start"><tspan x="32" dy="0">Nothing is reserved between the quote and the pick-up, so the live re-check is what keeps promises honest. The yard can prepare with the Pick slip before the</tspan><tspan x="32" dy="13.4">customer arrives (Round 1, 07:00 pre-pick).</tspan></text><rect x="40" y="747" width="13" height="13" rx="3" fill="#ede7fb" stroke="#9b87d8" stroke-width="1.5"/><text x="59" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="59" dy="0">AI-assisted (local embeddings)</tspan></text><rect x="300" y="747" width="13" height="13" rx="3" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.5"/><text x="319" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="319" dy="0">Hard rules (deterministic)</tspan></text><rect x="480" y="747" width="13" height="13" rx="3" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.5"/><text x="499" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="499" dy="0">Human decision or action</tspan></text><rect x="650" y="747" width="13" height="13" rx="3" fill="#fde7c7" stroke="#e8a64a" stroke-width="1.5"/><text x="669" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="669" dy="0">R1 = Round 1 problem</tspan></text><text x="1083" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="end"><tspan x="1083" dy="0">FR = requirement in the team's SRS v2</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">User Journey · page 2/2</tspan></text></svg></s
