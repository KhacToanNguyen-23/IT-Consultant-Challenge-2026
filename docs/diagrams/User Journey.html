<!doctype html><html lang='en'><head><meta charset='utf-8'><title>SiteDesk User Journey</title><style>@page{size:297mm 210mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff}.page{width:297mm;height:210mm;overflow:hidden;page-break-after:always}.page:last-child{page-break-after:auto}.page svg{display:block;width:100%;height:100%}</style></head><body><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">User journey 1: at the counter, from list to confirmed order</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">The associate serves the customer in person. SRS v2: UC1 to UC4, FR-001 to FR-020.</tspan></text><rect x="20" y="104" width="1085" height="158" fill="#f6f9fd" stroke="#d3deec"/><rect x="20" y="104" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,183.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Customer</text><rect x="20" y="262" width="1085" height="158" fill="#eef4fb" stroke="#d3deec"/><rect x="20" y="262" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,341.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Counter associate</text><rect x="20" y="420" width="1085" height="158" fill="#f6f9fd" stroke="#d3deec"/><rect x="20" y="420" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,499.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">SiteDesk</text><rect x="60" y="115.0" width="104" height="136" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.6"/><circle cx="72" cy="127.0" r="10" fill="#0b3a6b"/><text x="72" y="131.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">1</tspan></text><text x="68" y="153.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="68" dy="0">Hands over the</tspan><tspan x="68" dy="13.2">list (PDF,</tspan><tspan x="68" dy="13.2">pasted text or</tspan><tspan x="68" dy="13.2">e-mail text)</tspan></text><text x="68" y="243.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="68" dy="0">UC1</tspan></text><rect x="177" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="189" cy="285.0" r="10" fill="#0b3a6b"/><text x="189" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="189" dy="0">2</tspan></text><text x="185" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="185" dy="0">Uploads or</tspan><tspan x="185" dy="13.2">pastes it, then</tspan><tspan x="185" dy="13.2">Read list</tspan></text><text x="185" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="185" dy="0">FR-001</tspan></text><rect x="294" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="306" cy="443.0" r="10" fill="#0b3a6b"/><text x="306" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">3</tspan></text><text x="302" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="302" dy="0">Masks e-mail</tspan><tspan x="302" dy="13.2">and phone;</tspan><tspan x="302" dy="13.2">reads every</tspan><tspan x="302" dy="13.2">line, keeps</tspan><tspan x="302" dy="13.2">unreadable ones</tspan></text><text x="302" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="302" dy="0">FR-002 · 005</tspan></text><rect x="411" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="423" cy="443.0" r="10" fill="#0b3a6b"/><text x="423" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">4</tspan></text><text x="419" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="419" dy="0">Matches SKUs,</tspan><tspan x="419" dy="13.2">converts units,</tspan><tspan x="419" dy="13.2">checks live</tspan><tspan x="419" dy="13.2">stock</tspan></text><text x="419" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="419" dy="0">FR-006 to 014</tspan></text><rect x="528" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="540" cy="285.0" r="10" fill="#0b3a6b"/><text x="540" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="540" dy="0">5</tspan></text><text x="536" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="536" dy="0">Reviews</tspan><tspan x="536" dy="13.2">exceptions</tspan><tspan x="536" dy="13.2">first; Confirm</tspan><tspan x="536" dy="13.2">blocked until</tspan><tspan x="536" dy="13.2">all are</tspan><tspan x="536" dy="13.2">resolved</tspan></text><text x="536" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="536" dy="0">FR-010</tspan></text><rect x="645" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="657" cy="443.0" r="10" fill="#0b3a6b"/><text x="657" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="657" dy="0">6</tspan></text><text x="653" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="653" dy="0">Short or out of</tspan><tspan x="653" dy="13.2">stock: safe</tspan><tspan x="653" dy="13.2">alternative</tspan><tspan x="653" dy="13.2">with price</tspan><tspan x="653" dy="13.2">difference</tspan></text><text x="653" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="653" dy="0">FR-015</tspan></text><rect x="762" y="115.0" width="104" height="136" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.6"/><circle cx="774" cy="127.0" r="10" fill="#0b3a6b"/><text x="774" y="131.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="774" dy="0">7</tspan></text><text x="770" y="153.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="770" dy="0">Accepts or</tspan><tspan x="770" dy="13.2">declines the</tspan><tspan x="770" dy="13.2">alternative</tspan></text><text x="770" y="243.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="770" dy="0">FR-016</tspan></text><rect x="879" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="891" cy="285.0" r="10" fill="#0b3a6b"/><text x="891" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="891" dy="0">8</tspan></text><text x="887" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="887" dy="0">Chooses client</tspan><tspan x="887" dy="13.2">or walk-in,</tspan><tspan x="887" dy="13.2">then Confirm</tspan></text><text x="887" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="887" dy="0">FR-017 · 018</tspan></text><rect x="996" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="1008" cy="443.0" r="10" fill="#0b3a6b"/><text x="1008" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1008" dy="0">9</tspan></text><text x="1004" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="1004" dy="0">POS accepts:</tspan><tspan x="1004" dy="13.2">reference. POS</tspan><tspan x="1004" dy="13.2">down: CSV, same</tspan><tspan x="1004" dy="13.2">reference</tspan></text><text x="1004" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="1004" dy="0">FR-019 · 037</tspan></text><path d="M164,183.0 L170.5,183.0 L170.5,341.0 L177,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M281,341.0 L287.5,341.0 L287.5,499.0 L294,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M398,499.0 L411,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M515,499.0 L521.5,499.0 L521.5,341.0 L528,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M632,341.0 L638.5,341.0 L638.5,499.0 L645,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M749,499.0 L755.5,499.0 L755.5,183.0 L762,183.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M866,183.0 L872.5,183.0 L872.5,341.0 L879,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M983,341.0 L989.5,341.0 L989.5,499.0 L996,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><text x="20" y="598" font-size="13" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="20" dy="0">Alternative paths and guardrails</tspan></text><rect x="20.0" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="30.0" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="30.0" dy="0">AI is off</tspan></text><text x="30.0" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="30.0" dy="0">Hard rules and manual catalog search keep</tspan><tspan x="30.0" dy="13.6">the counter running; suggestions are</tspan><tspan x="30.0" dy="13.6">labelled rule-based (FR-003, 033).</tspan></text><rect x="294.25" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="304.25" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="304.25" dy="0">Line is not an order line</tspan></text><text x="304.25" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="304.25" dy="0">The associate removes it (title,</tspan><tspan x="304.25" dy="13.6">greeting). Confirm is refused when the</tspan><tspan x="304.25" dy="13.6">last line would go.</tspan></text><rect x="568.5" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="578.5" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="578.5" dy="0">Customer declines</tspan></text><text x="578.5" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="578.5" dy="0">A reason is recorded and the line stays</tspan><tspan x="578.5" dy="13.6">open; the SKU never changes without</tspan><tspan x="578.5" dy="13.6">agreement (FR-016).</tspan></text><rect x="842.75" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="852.75" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="852.75" dy="0">POS is down</tspan></text><text x="852.75" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="852.75" dy="0">CSV export with the same reference; status</tspan><tspan x="852.75" dy="13.6">NEEDS_MANUAL; the associate keys it into</tspan><tspan x="852.75" dy="13.6">the legacy POS.</tspan></text><rect x="20" y="690" width="1085" height="58" rx="8" fill="#e8f4ec" stroke="#8fc3a0"/><text x="32" y="708" font-size="12" font-weight="800" fill="#1f6b3f" text-anchor="start"><tspan x="32" dy="0">Value shown on the receipt of every order</tspan></text><text x="32" y="725" font-size="11" font-weight="400" fill="#1f3a2a" text-anchor="start"><tspan x="32" dy="0">Sales rescued by substitutes · time from upload to Confirm. Measured per order on simulated data; Round 1 targets are not claimed as results.</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">User Journey · page 1/2</tspan></text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">User journey 2: e-mail request to pre-order and pick-up</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">The customer is not at the counter. SRS v2: UC5, FR-022 to FR-028, FR-039 and FR-040.</tspan></text><rect x="20" y="104" width="1085" height="158" fill="#f6f9fd" stroke="#d3deec"/><rect x="20" y="104" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,183.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Customer</text><rect x="20" y="262" width="1085" height="158" fill="#eef4fb" stroke="#d3deec"/><rect x="20" y="262" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,341.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">Counter associate</text><rect x="20" y="420" width="1085" height="158" fill="#f6f9fd" stroke="#d3deec"/><rect x="20" y="420" width="30" height="158" fill="#0b3a6b"/><text transform="translate(41,499.0) rotate(-90)" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">SiteDesk</text><rect x="60" y="115.0" width="104" height="136" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.6"/><circle cx="72" cy="127.0" r="10" fill="#0b3a6b"/><text x="72" y="131.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="72" dy="0">1</tspan></text><text x="68" y="153.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="68" dy="0">Sends the</tspan><tspan x="68" dy="13.2">material list</tspan><tspan x="68" dy="13.2">by e-mail</tspan></text><text x="68" y="243.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="68" dy="0">UC5</tspan></text><rect x="177" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="189" cy="285.0" r="10" fill="#0b3a6b"/><text x="189" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="189" dy="0">2</tspan></text><text x="185" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="185" dy="0">Copies the</tspan><tspan x="185" dy="13.2">e-mail text</tspan><tspan x="185" dy="13.2">into SiteDesk</tspan><tspan x="185" dy="13.2">(E-mail quote)</tspan></text><text x="185" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="185" dy="0">FR-022</tspan></text><rect x="294" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="306" cy="443.0" r="10" fill="#0b3a6b"/><text x="306" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="306" dy="0">3</tspan></text><text x="302" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="302" dy="0">Masks, matches,</tspan><tspan x="302" dy="13.2">checks stock;</tspan><tspan x="302" dy="13.2">short lines get</tspan><tspan x="302" dy="13.2">alternatives</tspan></text><text x="302" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="302" dy="0">FR-006 to 015</tspan></text><rect x="411" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="423" cy="285.0" r="10" fill="#0b3a6b"/><text x="423" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="423" dy="0">4</tspan></text><text x="419" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="419" dy="0">Copy reply to</tspan><tspan x="419" dy="13.2">customer; sends</tspan><tspan x="419" dy="13.2">it from own</tspan><tspan x="419" dy="13.2">mailbox</tspan></text><text x="419" y="389.5" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="419" dy="0">SiteDesk sends no</tspan><tspan x="419" dy="11.5">e-mail</tspan></text><rect x="528" y="115.0" width="104" height="136" rx="8" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.6"/><circle cx="540" cy="127.0" r="10" fill="#0b3a6b"/><text x="540" y="131.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="540" dy="0">5</tspan></text><text x="536" y="153.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="536" dy="0">Agrees by</tspan><tspan x="536" dy="13.2">e-mail or</tspan><tspan x="536" dy="13.2">phone, outside</tspan><tspan x="536" dy="13.2">SiteDesk</tspan></text><text x="536" y="243.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="536" dy="0">FR-039</tspan></text><rect x="645" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="657" cy="443.0" r="10" fill="#0b3a6b"/><text x="657" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="657" dy="0">6</tspan></text><text x="653" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="653" dy="0">Save quote:</tspan><tspan x="653" dy="13.2">price and stock</tspan><tspan x="653" dy="13.2">snapshot, not</tspan><tspan x="653" dy="13.2">reserved</tspan></text><text x="653" y="547.5" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="653" dy="0">FR-023 · 024 ·</tspan><tspan x="653" dy="11.5">040</tspan></text><rect x="762" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="774" cy="285.0" r="10" fill="#0b3a6b"/><text x="774" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="774" dy="0">7</tspan></text><text x="770" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="770" dy="0">Record sent,</tspan><tspan x="770" dy="13.2">then Record</tspan><tspan x="770" dy="13.2">approval</tspan><tspan x="770" dy="13.2">(channel)</tspan></text><text x="770" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="770" dy="0">FR-022</tspan></text><rect x="879" y="431.0" width="104" height="136" rx="8" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.6"/><circle cx="891" cy="443.0" r="10" fill="#0b3a6b"/><text x="891" y="447.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="891" dy="0">8</tspan></text><text x="887" y="469.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="887" dy="0">At pick-up: re-</tspan><tspan x="887" dy="13.2">check live</tspan><tspan x="887" dy="13.2">stock and</tspan><tspan x="887" dy="13.2">price, show</tspan><tspan x="887" dy="13.2">changes</tspan></text><text x="887" y="559.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="887" dy="0">FR-025</tspan></text><rect x="996" y="273.0" width="104" height="136" rx="8" fill="#e6effa" stroke="#8fb3dd" stroke-width="1.6"/><circle cx="1008" cy="285.0" r="10" fill="#0b3a6b"/><text x="1008" y="289.0" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1008" dy="0">9</tspan></text><text x="1004" y="311.0" font-size="11" font-weight="500" fill="#17202c" text-anchor="start"><tspan x="1004" dy="0">Customer</tspan><tspan x="1004" dy="13.2">accepts</tspan><tspan x="1004" dy="13.2">substitutes;</tspan><tspan x="1004" dy="13.2">Pick slip;</tspan><tspan x="1004" dy="13.2">Confirm to POS</tspan><tspan x="1004" dy="13.2">or CSV</tspan></text><text x="1004" y="401.0" font-size="10.5" font-weight="700" fill="#1f5f9c" text-anchor="start"><tspan x="1004" dy="0">FR-026 · 028</tspan></text><path d="M164,183.0 L170.5,183.0 L170.5,341.0 L177,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M281,341.0 L287.5,341.0 L287.5,499.0 L294,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M398,499.0 L404.5,499.0 L404.5,341.0 L411,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M515,341.0 L521.5,341.0 L521.5,183.0 L528,183.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M632,183.0 L638.5,183.0 L638.5,499.0 L645,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M749,499.0 L755.5,499.0 L755.5,341.0 L762,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M866,341.0 L872.5,341.0 L872.5,499.0 L879,499.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><path d="M983,499.0 L989.5,499.0 L989.5,341.0 L996,341.0" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><text x="20" y="598" font-size="13" font-weight="800" fill="#b45309" text-anchor="start"><tspan x="20" dy="0">Alternative paths and guardrails</tspan></text><rect x="20.0" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="30.0" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="30.0" dy="0">No quote, no Confirm</tspan></text><text x="30.0" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="30.0" dy="0">An e-mail request cannot be confirmed</tspan><tspan x="30.0" dy="13.6">without its quote (QUOTE_REQUIRED).</tspan></text><rect x="294.25" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="304.25" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="304.25" dy="0">No approval, no Prepare</tspan></text><text x="304.25" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="304.25" dy="0">Sending the quote is not approval: Prepare</tspan><tspan x="304.25" dy="13.6">is refused until the customer's approval</tspan><tspan x="304.25" dy="13.6">is recorded.</tspan></text><rect x="568.5" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="578.5" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="578.5" dy="0">Stock changed since the quote</tspan></text><text x="578.5" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="578.5" dy="0">The re-check marks short lines; the</tspan><tspan x="578.5" dy="13.6">substitute is accepted only now, when the</tspan><tspan x="578.5" dy="13.6">customer is there.</tspan></text><rect x="842.75" y="608" width="262.25" height="72" rx="8" fill="#fff4e5" stroke="#f0b866"/><text x="852.75" y="626" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="start"><tspan x="852.75" dy="0">Quote expires or is cancelled</tspan></text><text x="852.75" y="643" font-size="11" font-weight="400" fill="#3b2a10" text-anchor="start"><tspan x="852.75" dy="0">Expiry is evaluated when the quote is</tspan><tspan x="852.75" dy="13.6">opened; an expired or cancelled quote</tspan><tspan x="852.75" dy="13.6">cannot be confirmed.</tspan></text><rect x="20" y="690" width="1085" height="58" rx="8" fill="#e8f4ec" stroke="#8fc3a0"/><text x="32" y="708" font-size="12" font-weight="800" fill="#1f6b3f" text-anchor="start"><tspan x="32" dy="0">Why this journey matters</tspan></text><text x="32" y="725" font-size="11" font-weight="400" fill="#1f3a2a" text-anchor="start"><tspan x="32" dy="0">Nothing is reserved between the quote and the pick-up, so the live re-check is what keeps promises honest. The yard can prepare with the Pick slip before the</tspan><tspan x="32" dy="13.4">customer arrives (Round 1, 07:00 pre-pick).</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">User Journey · page 2/2</tspan></text></svg></section></body></html>
