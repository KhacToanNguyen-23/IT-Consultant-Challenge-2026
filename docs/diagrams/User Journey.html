es before pick-up cause wrong picks</tspan></text><rect x="789" y="601" width="302" height="30" rx="6" fill="#fde7c7" stroke="#e8a64a"/><text x="940.0" y="615" font-size="11" font-weight="600" fill="#7a4300" text-anchor="middle"><tspan x="940.0" dy="0">Fragmented systems: one standard order</tspan></text><rect x="20" y="650" width="1085" height="62" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="32" y="670" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="32" dy="0">READING THE FLOW</tspan></text><text x="32" y="688" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="32" dy="0">SiteDesk drafts the reply but sends no e-mail. Nothing is reserved between quote and pick-up, so the live re-check decides what can be promised. An e-mail request cannot be</tspan><tspan x="32" dy="14">confirmed without its quote, and an order cannot be prepared without a recorded customer approval.</tspan></text><rect x="40" y="747" width="13" height="13" rx="3" fill="#ede7fb" stroke="#9b87d8" stroke-width="1.5"/><text x="59" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="59" dy="0">AI-assisted</tspan></text><rect x="150" y="747" width="13" height="13" rx="3" fill="#dbe9f9" stroke="#6f9ad0" stroke-width="1.5"/><text x="169" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="169" dy="0">Hard rules</tspan></text><rect x="250" y="747" width="13" height="13" rx="3" fill="#e8f4ec" stroke="#8fc3a0" stroke-width="1.5"/><text x="269" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="269" dy="0">Human</tspan></text><rect x="330" y="747" width="13" height="13" rx="3" fill="#fff1dc" stroke="#e0a040" stroke-width="1.5"/><text x="349" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="349" dy="0">Exception or fallback</tspan></text><rect x="500" y="747" width="13" height="13" rx="3" fill="#fff8e1" stroke="#d9b44a" stroke-width="1.5"/><text x="519" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="519" dy="0">Decision (diamond)</tspan></text><rect x="655" y="747" width="13" height="13" rx="3" fill="#fde7c7" stroke="#e8a64a" stroke-width="1.5"/><text x="674" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="674" dy="0">R1 = Round 1 problem</tspan></text><text x="1083" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="end"><tspan x="1083" dy="0">FR = requirement in the team's SRS v2</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">User Journey · page 2/2</tspan></text></svg></section></body></html>
