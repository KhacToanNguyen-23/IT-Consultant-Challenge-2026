<!doctype html><html lang='en'><head><meta charset='utf-8'><title>SiteDesk System Diagram</title><style>@page{size:297mm 210mm;margin:0}*{box-sizing:border-box}body{margin:0;background:#fff}.page{width:297mm;height:210mm;overflow:hidden;page-break-after:always}.page:last-child{page-break-after:auto}.page svg{display:block;width:100%;height:100%}</style></head><body><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP: system context (C4 level 1)</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">Who uses SiteDesk, which systems sit outside it, and what is exchanged. SRS v2 §3, §7.</tspan></text><rect x="50" y="160" width="210" height="100" rx="10" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="2"/><text x="155.0" y="184" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">Customer</tspan></text><text x="155.0" y="201" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">Person</tspan></text><text x="155.0" y="221" font-size="12" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">B2B contractor or walk-in;</tspan><tspan x="155.0" dy="16.200000000000003">gives the list, agrees or</tspan><tspan x="155.0" dy="16.200000000000003">declines substitutes</tspan></text><rect x="50" y="410" width="210" height="100" rx="10" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="2"/><text x="155.0" y="434" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">Counter associate</tspan></text><text x="155.0" y="451" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">Person</tspan></text><text x="155.0" y="471" font-size="12" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="155.0" dy="0">Reads, reviews and confirms;</tspan><tspan x="155.0" dy="16.200000000000003">asks the customer to decide</tspan></text><path d="M155,260 L155,410" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="162" y="327.5" width="138.8" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="166" y="340" font-size="11.5" font-weight="500" fill="#243447" text-anchor="start"><tspan x="166" dy="0">List · decisions</tspan><tspan x="166" dy="14.950000000000001">[in person / e-mail]</tspan></text><rect x="430" y="118" width="350" height="402" rx="16" fill="#f1f6fc" stroke="#7aa6d6" stroke-width="2" stroke-dasharray="9 6"/><text x="448" y="142" font-size="13" font-weight="700" fill="#0b3a6b" text-anchor="start"><tspan x="448" dy="0">SiteDesk MVP · system boundary</tspan></text><rect x="448" y="205" width="314" height="250" rx="10" fill="#1768ac" stroke="#1768ac" stroke-width="2"/><text x="605.0" y="229" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="605.0" dy="0">SiteDesk</tspan></text><text x="605.0" y="246" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="605.0" dy="0">Software system</tspan></text><text x="605.0" y="266" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="605.0" dy="0">AI-assisted second screen for the counter</tspan><tspan x="605.0" dy="14.850000000000001"></tspan><tspan x="605.0" dy="14.850000000000001">Intake and masking of e-mail/phone  (FR-001, 002)</tspan><tspan x="605.0" dy="14.850000000000001">Hybrid SKU matching, hard rules  (FR-006 to 009)</tspan><tspan x="605.0" dy="14.850000000000001">Unit conversion, stock, alternatives  (FR-011 to 016)</tspan><tspan x="605.0" dy="14.850000000000001">Quotes and pre-orders  (FR-022 to 028)</tspan><tspan x="605.0" dy="14.850000000000001">Order export, CSV fallback  (FR-018 to 020)</tspan><tspan x="605.0" dy="14.850000000000001">Decision log and KPI queries  (FR-029 to 031)</tspan></text><path d="M260,470 L345,470 L345,330 L448,330" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="264" y="485.5" width="119.48" height="65.80000000000001" rx="4" fill="#fff" opacity="0.94"/><text x="268" y="498" font-size="11.5" font-weight="500" fill="#243447" text-anchor="start"><tspan x="268" dy="0">Pastes or</tspan><tspan x="268" dy="14.950000000000001">uploads the list;</tspan><tspan x="268" dy="14.950000000000001">reviews; confirms</tspan><tspan x="268" dy="14.950000000000001">[browser, HTTP]</tspan></text><rect x="900" y="150" width="205" height="100" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="1002.5" y="174" font-size="14" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">LLM API provider</tspan></text><text x="1002.5" y="191" font-size="11" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">External · optional</tspan></text><text x="1002.5" y="211" font-size="12" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">Optional: clarifies unusual</tspan><tspan x="1002.5" dy="16.200000000000003">wording. Off in this demo.</tspan></text><rect x="900" y="300" width="205" height="120" rx="10" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><text x="1002.5" y="324" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1002.5" dy="0">mock-pos</tspan></text><text x="1002.5" y="341" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="1002.5" dy="0">External · simulated</tspan></text><text x="1002.5" y="361" font-size="12" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="1002.5" dy="0">Simulated POS/ERP: catalog,</tspan><tspan x="1002.5" dy="16.200000000000003">price, stock, customers,</tspan><tspan x="1002.5" dy="16.200000000000003">order receipt</tspan></text><rect x="900" y="480" width="205" height="105" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="1002.5" y="504" font-size="14" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">Legacy POS (manual)</tspan></text><text x="1002.5" y="521" font-size="11" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">External · outside MVP</tspan></text><text x="1002.5" y="541" font-size="12" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1002.5" dy="0">Associate keys the order</tspan><tspan x="1002.5" dy="16.200000000000003">in by hand from the CSV</tspan></text><path d="M762,230 L900,230" fill="none" stroke="#5b6b7e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="774.48" y="199.5" width="113.04" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="831" y="212" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="831" dy="0">Masked text only</tspan><tspan x="831" dy="14.950000000000001">[HTTPS / JSON]</tspan></text><path d="M762,360 L900,360" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="768.04" y="317.5" width="125.92000000000002" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="831" y="330" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="831" dy="0">Catalog · stock</tspan><tspan x="831" dy="14.950000000000001">customers · orders</tspan></text><rect x="784.14" y="379.5" width="93.72000000000001" height="20.950000000000003" rx="4" fill="#fff" opacity="0.94"/><text x="831" y="392" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="831" dy="0">[REST / JSON]</tspan></text><path d="M620,455 L620,540 L900,540" fill="none" stroke="#5b6b7e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="677.72" y="553.5" width="164.56" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="760" y="566" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="760" dy="0">CSV when the POS is down</tspan><tspan x="760" dy="14.950000000000001">[file download]</tspan></text><rect x="40" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="52" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="52" dy="0">MVP SCOPE</tspan></text><text x="52" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="52" dy="0">Sign-in is simulated inside SiteDesk (not SSO).</tspan><tspan x="52" dy="15.180000000000001">Embeddings run locally; the LLM is optional.</tspan><tspan x="52" dy="15.180000000000001">Prices, stock and customers come from mock-pos.</tspan></text><rect x="400" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="412" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="412" dy="0">DATA LIMIT</tspan></text><text x="412" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="412" dy="0">A regex masks e-mail addresses and phone numbers</tspan><tspan x="412" dy="15.180000000000001">before any AI call. Names, addresses and other</tspan><tspan x="412" dy="15.180000000000001">personal data in free text are not guaranteed removed.</tspan></text><rect x="760" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="772" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="772" dy="0">OUTCOME</tspan></text><text x="772" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="772" dy="0">POS accepts: POS_ACCEPTED + reference.</tspan><tspan x="772" dy="15.180000000000001">POS 503 / timeout: CSV, NEEDS_MANUAL; the POS</tspan><tspan x="772" dy="15.180000000000001">has not accepted the order.</tspan></text><rect x="40" y="747" width="11" height="11" rx="3" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="1.5"/><text x="57" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="57" dy="0">Person</tspan></text><rect x="105" y="747" width="11" height="11" rx="3" fill="#1768ac" stroke="#1768ac" stroke-width="1.5"/><text x="122" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="122" dy="0">SiteDesk part</tspan></text><rect x="205" y="747" width="11" height="11" rx="3" fill="#2d8a5a" stroke="#2d8a5a" stroke-width="1.5"/><text x="222" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="222" dy="0">Data store</tspan></text><rect x="285" y="747" width="11" height="11" rx="3" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/><text x="302" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="302" dy="0">External, simulated</tspan></text><rect x="425" y="747" width="11" height="11" rx="3" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/><text x="442" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="442" dy="0">External, optional or manual</tspan></text><text x="1083" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="end"><tspan x="1083" dy="0">FR = requirement in the team's SRS v2</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">System Diagram · page 1/2</tspan></text></svg></section><section class="page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="1123" height="794" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 z" fill="#5b6b7e"/></marker></defs><rect width="1123" height="794" fill="#ffffff"/><text x="40" y="46" font-size="24" font-weight="800" fill="#0b3a6b" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP: containers (C4 level 2)</tspan></text><text x="40" y="68" font-size="13" font-weight="400" fill="#52627a" text-anchor="start"><tspan x="40" dy="0">Deployable parts and the data store, and how they talk to each other and to the outside. Run locally with Docker Compose.</tspan></text><rect x="40" y="175" width="185" height="100" rx="10" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="2"/><text x="132.5" y="199" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="132.5" dy="0">Counter associate</tspan></text><text x="132.5" y="216" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="132.5" dy="0">Person</tspan></text><text x="132.5" y="236" font-size="12" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="132.5" dy="0">Uses the counter and</tspan><tspan x="132.5" dy="16.200000000000003">quote screens</tspan></text><rect x="280" y="108" width="570" height="486" rx="16" fill="#f1f6fc" stroke="#7aa6d6" stroke-width="2" stroke-dasharray="9 6"/><text x="298" y="132" font-size="13" font-weight="700" fill="#0b3a6b" text-anchor="start"><tspan x="298" dy="0">SiteDesk · containers</tspan></text><rect x="305" y="160" width="180" height="120" rx="10" fill="#1768ac" stroke="#1768ac" stroke-width="2"/><text x="395.0" y="184" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">Web UI</tspan></text><text x="395.0" y="201" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">Next.js 14</tspan></text><text x="395.0" y="221" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">Intake, review by exception,</tspan><tspan x="395.0" dy="14.850000000000001">quotes, print, demo toggles</tspan></text><rect x="590" y="150" width="235" height="320" rx="10" fill="#1768ac" stroke="#1768ac" stroke-width="2"/><text x="707.5" y="174" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="707.5" dy="0">Core API</tspan></text><text x="707.5" y="191" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="707.5" dy="0">FastAPI (Python)</tspan></text><text x="707.5" y="211" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="707.5" dy="0">Parse + PII masking · FR-001/002</tspan><tspan x="707.5" dy="14.850000000000001">Matcher + hard rules · FR-006 to 009</tspan><tspan x="707.5" dy="14.850000000000001">Convert, stock, alternatives · FR-011 to 016</tspan><tspan x="707.5" dy="14.850000000000001">Quotes, orders, idempotency · FR-018 to 028</tspan><tspan x="707.5" dy="14.850000000000001">CSV when the POS is down · FR-019</tspan><tspan x="707.5" dy="14.850000000000001">Telemetry, KPI queries · FR-029 to 031</tspan><tspan x="707.5" dy="14.850000000000001"></tspan><tspan x="707.5" dy="14.850000000000001">In-process modules:</tspan><tspan x="707.5" dy="14.850000000000001">AI Gateway · Local Connector</tspan></text><rect x="606" y="396" width="203" height="58" rx="8" fill="#e9f3ff" stroke="#9bc5e5" stroke-width="2"/><text x="707" y="418" font-size="12" font-weight="700" fill="#0b3a6b" text-anchor="middle"><tspan x="707" dy="0">Local embedding model</tspan></text><text x="707" y="436" font-size="11" font-weight="400" fill="#244a6e" text-anchor="middle"><tspan x="707" dy="0">multilingual-e5-small · no data leaves</tspan></text><rect x="305" y="340" width="180" height="160" rx="10" fill="#2d8a5a" stroke="#2d8a5a" stroke-width="2"/><text x="395.0" y="364" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">SiteDesk DB</tspan></text><text x="395.0" y="381" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">PostgreSQL 15 + pgvector</tspan></text><text x="395.0" y="401" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="395.0" dy="0">Catalog + vectors,</tspan><tspan x="395.0" dy="14.850000000000001">sessions, quotes,</tspan><tspan x="395.0" dy="14.850000000000001">decisions, audit</tspan></text><rect x="920" y="150" width="185" height="100" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 5"/><text x="1012.5" y="174" font-size="14" font-weight="700" fill="#374151" text-anchor="middle"><tspan x="1012.5" dy="0">LLM API</tspan></text><text x="1012.5" y="191" font-size="11" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1012.5" dy="0">External · optional</tspan></text><text x="1012.5" y="211" font-size="12" font-weight="400" fill="#374151" text-anchor="middle"><tspan x="1012.5" dy="0">Optional, masked</tspan><tspan x="1012.5" dy="16.200000000000003">text only</tspan></text><rect x="920" y="320" width="185" height="115" rx="10" fill="#6b7280" stroke="#6b7280" stroke-width="2"/><text x="1012.5" y="344" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1012.5" dy="0">mock-pos</tspan></text><text x="1012.5" y="361" font-size="11" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="1012.5" dy="0">External · simulated</tspan></text><text x="1012.5" y="381" font-size="12" font-weight="400" fill="#fff" text-anchor="middle"><tspan x="1012.5" dy="0">Simulated catalog,</tspan><tspan x="1012.5" dy="16.200000000000003">stock, customers,</tspan><tspan x="1012.5" dy="16.200000000000003">order receipt</tspan></text><path d="M225,225 L305,225" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="237.46" y="190.5" width="55.080000000000005" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="265" y="203" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="265" dy="0">Browser</tspan><tspan x="265" dy="14.950000000000001">[HTTP]</tspan></text><path d="M485,220 L590,220" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="512.68" y="185.5" width="48.64" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="537" y="198" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="537" dy="0">REST</tspan><tspan x="537" dy="14.950000000000001">[JSON]</tspan></text><path d="M590,420 L485,420" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="506.24" y="391.5" width="61.52" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="537" y="404" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="537" dy="0">SQL</tspan><tspan x="537" dy="14.950000000000001">pgvector</tspan></text><path d="M825,215 L920,215" fill="none" stroke="#5b6b7e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ah)"/><rect x="831.58" y="180.5" width="80.84" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="872" y="193" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="872" dy="0">Masked text</tspan><tspan x="872" dy="14.950000000000001">[HTTPS]</tspan></text><path d="M825,380 L920,380" fill="none" stroke="#5b6b7e" stroke-width="2" marker-end="url(#ah)"/><rect x="812.26" y="337.5" width="119.48" height="35.900000000000006" rx="4" fill="#fff" opacity="0.94"/><text x="872" y="350" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="872" dy="0">Catalog, stock,</tspan><tspan x="872" dy="14.950000000000001">customers, orders</tspan></text><rect x="825.14" y="393.5" width="93.72000000000001" height="20.950000000000003" rx="4" fill="#fff" opacity="0.94"/><text x="872" y="406" font-size="11.5" font-weight="500" fill="#243447" text-anchor="middle"><tspan x="872" dy="0">[REST / JSON]</tspan></text><rect x="40" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="52" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="52" dy="0">CONTAINER RULE</tspan></text><text x="52" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="52" dy="0">The AI Gateway and the Local Connector are in-process</tspan><tspan x="52" dy="15.180000000000001">modules of the FastAPI core, not separate containers.</tspan><tspan x="52" dy="15.180000000000001">The vector index lives inside PostgreSQL (pgvector).</tspan></text><rect x="400" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="412" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="412" dy="0">AI AND PRIVACY</tspan></text><text x="412" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="412" dy="0">Matching runs on local embeddings plus hard rules,</tspan><tspan x="412" dy="15.180000000000001">so the AI path needs no external service.</tspan><tspan x="412" dy="15.180000000000001">The LLM, when enabled, only sees masked text.</tspan></text><rect x="760" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="772" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="772" dy="0">FALLBACK</tspan></text><text x="772" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="772" dy="0">POS 503 / timeout: the connector writes a CSV and</tspan><tspan x="772" dy="15.180000000000001">the order is marked NEEDS_MANUAL, not POS_ACCEPTED.</tspan><tspan x="772" dy="15.180000000000001">AI off: rules and manual catalog search continue.</tspan></text><rect x="40" y="747" width="11" height="11" rx="3" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="1.5"/><text x="57" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="57" dy="0">Person</tspan></text><rect x="105" y="747" width="11" height="11" rx="3" fill="#1768ac" stroke="#1768ac" stroke-width="1.5"/><text x="122" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="122" dy="0">SiteDesk part</tspan></text><rect x="205" y="747" width="11" height="11" rx="3" fill="#2d8a5a" stroke="#2d8a5a" stroke-width="1.5"/><text x="222" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="222" dy="0">Data store</tspan></text><rect x="285" y="747" width="11" height="11" rx="3" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/><text x="302" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="302" dy="0">External, simulated</tspan></text><rect x="425" y="747" width="11" height="11" rx="3" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 2"/><text x="442" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="start"><tspan x="442" dy="0">External, optional or manual</tspan></text><text x="1083" y="757" font-size="11" font-weight="500" fill="#334155" text-anchor="end"><tspan x="1083" dy="0">FR = requirement in the team's SRS v2</tspan></text><text x="40" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="start"><tspan x="40" dy="0">SiteDesk MVP · IT Consultant Challenge 2026 · Round 2 · POS, stock, prices and customers are simulated</tspan></text><text x="1083" y="776" font-size="11" font-weight="400" fill="#7a8798" text-anchor="end"><tspan x="1083" dy="0">System Diagram · page 2/2</tspan></text></svg></section></body></html>
