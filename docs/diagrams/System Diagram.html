="872" dy="0">[REST / JSON]</tspan></text><rect x="40" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="52" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="52" dy="0">CONTAINER RULE</tspan></text><text x="52" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="52" dy="0">The AI Gateway and the Local Connector are in-process</tspan><tspan x="52" dy="15.180000000000001">modules of the FastAPI core, not separate containers.</tspan><tspan x="52" dy="15.180000000000001">The vector index lives inside PostgreSQL (pgvector).</tspan></text><rect x="400" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="412" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="412" dy="0">AI AND PRIVACY</tspan></text><text x="412" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="412" dy="0">Matching runs on local embeddings plus hard rules,</tspan><tspan x="412" dy="15.180000000000001">so the AI path needs no external service.</tspan><tspan x="412" dy="15.180000000000001">The LLM, when enabled, only sees masked text.</tspan></text><rect x="760" y="625" width="345" height="100" rx="8" fill="#fff8e1" stroke="#e0c35a"/><text x="772" y="645" font-size="12" font-weight="800" fill="#7a5a00" text-anchor="start"><tspan x="772" dy="0">FALLBACK</tspan></text><text x="772" y="663" font-size="11.5" font-weight="400" fill="#3b3320" text-anchor="start"><tspan x="772" dy="0">POS 503 / timeout: the connector writes a CSV and</tspan><tspan x="772" dy="15.180000000000001">the order is marked NEEDS_MANUAL, not POS_ACCEPTED.</tspan><tspan x="772" dy="15.180000000000001">AI off: rules and manual catalog search continue.</tspan></text><rect x="40" y="747" width="11" height="11" rx="3" fill="#0b3a6b" stroke="#0b3a6b" stroke-width="1.5"/><text x="57" y="757" font-size="11" font-weight="500" fill="#334155" tex
